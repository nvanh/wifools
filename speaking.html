<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Sentence Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=DM+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #17171a;
    --border: #2a2a30;
    --accent: #c8a96e;
    --accent-dim: rgba(200, 169, 110, 0.15);
    --text: #e8e4dc;
    --text-dim: #7a7870;
    --active-bg: #1e1c18;
    --playing-glow: rgba(200, 169, 110, 0.25);
  }

  body {
    font-family: 'Noto Serif KR', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 300;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  header p {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
  }

  .player-wrap {
    width: 100%;
    max-width: 680px;
  }

  /* Audio controls bar */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
  }

  .btn-play-all {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #0e0e10;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    font-weight: 400;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .btn-play-all:hover { opacity: 0.85; }
  .btn-play-all:active { transform: scale(0.97); }

  .speed-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-left: auto;
  }

  .speed-select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    outline: none;
  }

  /* Progress bar */
  .progress-wrap {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
  }

  /* Sentence list */
  .sentence-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sentence-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .sentence-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .sentence-item:hover {
    border-color: rgba(200, 169, 110, 0.4);
    background: var(--active-bg);
  }

  .sentence-item.playing {
    border-color: var(--accent);
    background: var(--active-bg);
    box-shadow: 0 0 20px var(--playing-glow);
  }

  .sentence-item.playing::before {
    opacity: 1;
  }

  .sentence-item.played .index {
    color: var(--accent);
    opacity: 0.5;
  }

  .index {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    padding-top: 3px;
    min-width: 22px;
    transition: color 0.2s;
  }

  .sentence-body {
    flex: 1;
  }

  .sentence-text {
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
    font-weight: 300;
    line-height: 1.65;
    color: var(--text);
    transition: color 0.2s;
  }

  .sentence-item.playing .sentence-text {
    color: #fff;
  }

  .timestamp {
    font-family: 'DM Mono', monospace;
    font-size: 0.63rem;
    color: var(--text-dim);
    margin-top: 5px;
    letter-spacing: 0.06em;
  }

  .play-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-dim);
    flex-shrink: 0;
    margin-top: 1px;
    transition: background 0.2s;
  }

  .sentence-item.playing .play-icon {
    background: var(--accent);
  }

  .play-icon svg { display: block; }

  .sentence-item:not(.playing) .icon-pause { display: none; }
  .sentence-item.playing .icon-play { display: none; }
  .sentence-item.playing .icon-pause { display: block; }

  /* Wave animation */
  .wave {
    display: none;
    align-items: center;
    gap: 3px;
    height: 16px;
    margin-top: 6px;
  }

  .sentence-item.playing .wave { display: flex; }

  .wave span {
    display: block;
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
  }

  .wave span:nth-child(1) { animation-delay: 0s; height: 6px; }
  .wave span:nth-child(2) { animation-delay: 0.12s; height: 12px; }
  .wave span:nth-child(3) { animation-delay: 0.24s; height: 8px; }
  .wave span:nth-child(4) { animation-delay: 0.08s; height: 14px; }
  .wave span:nth-child(5) { animation-delay: 0.16s; height: 6px; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* Notification */
  .note {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 28px;
    letter-spacing: 0.06em;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1>Korean Audio — Shopping</h1>
  <p>클릭하여 각 문장 재생 · Click to play each sentence</p>
</header>

<div class="player-wrap">
  <div class="controls-bar">
    <button class="btn-play-all" id="btnPlayAll">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
        <polygon points="2,1 11,6 2,11"/>
      </svg>
      Play All
    </button>
    <span class="speed-label">Speed</span>
    <select class="speed-select" id="speedSelect">
      <option value="0.7">0.7×</option>
      <option value="1" selected>1.0×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="sentence-list" id="sentenceList"></div>

  <p class="note">⚠ Drag the audio file <strong style="color:var(--accent)">Generated_Audio_June_05__2026_-_9_08PM.wav</strong> onto this page to enable playback.</p>
</div>

<audio id="audioEl" src="audio.mp3"></audio>

<script>
const SENTENCES = [
  { id: 1, start: 0.28,  end: 2.71,  text: "우리 집에서는 아내가 장을 봅니다." },
  { id: 2, start: 3.60,  end: 7.29,  text: "저도 가끔 쇼핑을 하지만 주로 인터넷으로 합니다." },
  { id: 3, start: 8.49,  end: 14.05, text: "인터넷으로 사는 물건은 대부분 전자제품이고, 가끔 음식도 주문합니다." },
  { id: 4, start: 15.32, end: 19.06, text: "자주 사용하는 쇼핑 앱은 쇼피인데, 정말 좋습니다." },
  { id: 5, start: 20.13, end: 24.39, text: "이 앱에는 다양한 상품이 많아서 거의 다 있는 것 같습니다." },
  { id: 6, start: 25.60, end: 29.81, text: "원하는 상품을 쉽게 찾을 수 있고 저렴한 가격에 살 수 있습니다." },
  { id: 7, start: 31.28, end: 37.21, text: "전반적으로 쇼피에서 쇼핑하는 것에 매우 만족하지만 가끔 불편할 때도 있습니다." },
  { id: 8, start: 38.40, end: 44.89, text: "예를 들어, 물건이 예상보다 늦게 와서 일주일 정도 기다린 적이 있는데, 너무 답답했습니다." },
  { id: 9, start: 46.16, end: 51.18, text: "또한 받은 상품이 앱의 설명과 다른 경우도 있어서 실망한 적도 있습니다." },
  { id: 10, start: 52.54, end: 60.63, text: "그럴 때마다 반품을 하고 환불을 기다려야 하는데, 환불받는 데 일주일에서 이주일 정도 걸려서 꽤 불편합니다." },
  { id: 11, start: 61.64, end: 67.51, text: "하지만 그 후부터는 주문하기 전에 후기를 먼저 읽는데, 많은 도움이 됩니다." },
  { id: 12, start: 68.76, end: 73.66, text: "그래도 인터넷 쇼핑은 편리해서 앞으로도 계속 이용할 것 같습니다." },
];

const audio = document.getElementById('audioEl');
const list = document.getElementById('sentenceList');
const progressFill = document.getElementById('progressFill');
const btnPlayAll = document.getElementById('btnPlayAll');
const speedSelect = document.getElementById('speedSelect');

let currentIdx = -1;
let playAllMode = false;
let audioLoaded = false;

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(2).padStart(5, '0');
  return `${String(m).padStart(2,'0')}:${sec}`;
}

// Render
SENTENCES.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'sentence-item';
  item.id = `s${i}`;
  item.innerHTML = `
    <span class="index">${String(s.id).padStart(2,'0')}</span>
    <div class="sentence-body">
      <div class="sentence-text">${s.text}</div>
      <div class="timestamp">${fmtTime(s.start)} → ${fmtTime(s.end)}</div>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="play-icon">
      <svg class="icon-play" width="11" height="11" viewBox="0 0 11 11" fill="var(--accent)">
        <polygon points="2,1 10,5.5 2,10"/>
      </svg>
      <svg class="icon-pause" width="11" height="11" viewBox="0 0 11 11" fill="#0e0e10">
        <rect x="2" y="1" width="3" height="9" rx="1"/>
        <rect x="7" y="1" width="3" height="9" rx="1"/>
      </svg>
    </div>
  `;
  item.addEventListener('click', () => playSentence(i, false));
  list.appendChild(item);
});

function setActive(idx) {
  document.querySelectorAll('.sentence-item').forEach((el, i) => {
    el.classList.toggle('playing', i === idx);
    if (i < idx) el.classList.add('played');
  });
  currentIdx = idx;
  const pct = SENTENCES.length > 1 ? (idx / (SENTENCES.length - 1)) * 100 : 0;
  progressFill.style.width = pct + '%';
  if (idx >= 0) {
    document.getElementById(`s${idx}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function clearActive() {
  document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('playing'));
  currentIdx = -1;
}

function playSentence(idx, fromPlayAll) {
  if (!audioLoaded) {
    showNoAudioMsg();
    return;
  }
  playAllMode = fromPlayAll;

  // Toggle if same sentence clicked
  if (!fromPlayAll && currentIdx === idx && !audio.paused) {
    audio.pause();
    clearActive();
    updatePlayAllBtn(false);
    return;
  }

  const s = SENTENCES[idx];
  audio.playbackRate = parseFloat(speedSelect.value);
  audio.currentTime = s.start;
  setActive(idx);
  audio.play().catch(() => showNoAudioMsg());
}

audio.addEventListener('timeupdate', () => {
  if (currentIdx < 0) return;
  const s = SENTENCES[currentIdx];
  if (audio.currentTime >= s.end) {
    if (playAllMode && currentIdx < SENTENCES.length - 1) {
      playSentence(currentIdx + 1, true);
    } else {
      audio.pause();
      clearActive();
      if (playAllMode) {
        progressFill.style.width = '100%';
        updatePlayAllBtn(false);
        playAllMode = false;
      }
    }
  }
});

audio.addEventListener('pause', () => {
  if (!playAllMode) clearActive();
});

btnPlayAll.addEventListener('click', () => {
  if (!audioLoaded) { showNoAudioMsg(); return; }
  if (playAllMode && !audio.paused) {
    audio.pause();
    playAllMode = false;
    updatePlayAllBtn(false);
    clearActive();
  } else {
    playSentence(0, true);
    updatePlayAllBtn(true);
  }
});

function updatePlayAllBtn(playing) {
  btnPlayAll.innerHTML = playing
    ? `<svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><rect x="2" y="1" width="3" height="9" rx="1"/><rect x="7" y="1" width="3" height="9" rx="1"/></svg> Pause All`
    : `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="2,1 11,6 2,11"/></svg> Play All`;
}

speedSelect.addEventListener('change', () => {
  audio.playbackRate = parseFloat(speedSelect.value);
});

// Drop audio file
let noAudioShown = false;
function showNoAudioMsg() {
  if (noAudioShown) return;
  noAudioShown = true;
  const note = document.querySelector('.note');
  note.style.color = '#c87070';
  note.textContent = '⚠ Please drag & drop the WAV file onto this page first.';
}

audioLoaded = true;
document.querySelector('.note').textContent = `✓ Loaded: ${file.name}`;
document.querySelector('.note').style.color = 'var(--accent)';
noAudioShown = false;

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.type.includes('audio') || file.name.endsWith('.wav'))) {
    const url = URL.createObjectURL(file);
    audio.src = url;
    audioLoaded = true;
    document.querySelector('.note').textContent = `✓ Loaded: ${file.name}`;
    document.querySelector('.note').style.color = 'var(--accent)';
    noAudioShown = false;
  }
});
</script>
</body>
</html>
