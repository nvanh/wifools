<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Sentence Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=DM+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #17171a;
    --border: #2a2a30;
    --accent: #c8a96e;
    --accent-dim: rgba(200, 169, 110, 0.15);
    --text: #e8e4dc;
    --text-dim: #7a7870;
    --active-bg: #1e1c18;
    --playing-glow: rgba(200, 169, 110, 0.25);
  }

  body {
    font-family: 'Noto Serif KR', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 300;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  header p {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
  }

  .player-wrap {
    width: 100%;
    max-width: 680px;
  }

  /* Audio controls bar */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
  }

  .btn-play-all {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #0e0e10;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    font-weight: 400;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .btn-play-all:hover { opacity: 0.85; }
  .btn-play-all:active { transform: scale(0.97); }

  .speed-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-left: auto;
  }

  .speed-select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    outline: none;
  }

  /* Progress bar */
  .progress-wrap {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
  }

  /* Sentence list */
  .sentence-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sentence-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .sentence-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .sentence-item:hover {
    border-color: rgba(200, 169, 110, 0.4);
    background: var(--active-bg);
  }

  .sentence-item.playing {
    border-color: var(--accent);
    background: var(--active-bg);
    box-shadow: 0 0 20px var(--playing-glow);
  }

  .sentence-item.playing::before {
    opacity: 1;
  }

  .sentence-item.played .index {
    color: var(--accent);
    opacity: 0.5;
  }

  .index {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    padding-top: 3px;
    min-width: 22px;
    transition: color 0.2s;
  }

  .sentence-body {
    flex: 1;
  }

  .sentence-text {
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
    font-weight: 300;
    line-height: 1.65;
    color: var(--text);
    transition: color 0.2s;
  }

  .sentence-item.playing .sentence-text {
    color: #fff;
  }

  .timestamp {
    font-family: 'DM Mono', monospace;
    font-size: 0.63rem;
    color: var(--text-dim);
    margin-top: 5px;
    letter-spacing: 0.06em;
  }

  .play-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-dim);
    flex-shrink: 0;
    margin-top: 1px;
    transition: background 0.2s;
  }

  .sentence-item.playing .play-icon {
    background: var(--accent);
  }

  .play-icon svg { display: block; }

  .sentence-item:not(.playing) .icon-pause { display: none; }
  .sentence-item.playing .icon-play { display: none; }
  .sentence-item.playing .icon-pause { display: block; }

  /* Wave animation */
  .wave {
    display: none;
    align-items: center;
    gap: 3px;
    height: 16px;
    margin-top: 6px;
  }

  .sentence-item.playing .wave { display: flex; }

  .wave span {
    display: block;
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
  }

  .wave span:nth-child(1) { animation-delay: 0s; height: 6px; }
  .wave span:nth-child(2) { animation-delay: 0.12s; height: 12px; }
  .wave span:nth-child(3) { animation-delay: 0.24s; height: 8px; }
  .wave span:nth-child(4) { animation-delay: 0.08s; height: 14px; }
  .wave span:nth-child(5) { animation-delay: 0.16s; height: 6px; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* Notification */
  .note {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 28px;
    letter-spacing: 0.06em;
    line-height: 1.6;
  }

  /* Translation */
  .btn-translate {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 8px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.63rem;
    color: var(--text-dim);
    letter-spacing: 0.07em;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .btn-translate:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .btn-translate.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .vi-text {
    display: none;
    margin-top: 7px;
    font-family: 'Noto Serif KR', serif;
    font-size: 0.82rem;
    font-weight: 300;
    color: var(--accent);
    line-height: 1.6;
    opacity: 0.85;
    padding-left: 2px;
    border-left: 2px solid var(--accent);
    padding-left: 8px;
  }

  .vi-text.visible {
    display: block;
  }
</style>
</head>
<body>

<header>
  <h1>Question — Shopping</h1>
  <p>클릭하여 각 문장 재생 · Click to play each sentence</p>
</header>

<div class="player-wrap">
  <div class="controls-bar">
    <button class="btn-play-all" id="btnPlayAll">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
        <polygon points="2,1 11,6 2,11"/>
      </svg>
      Play All
    </button>
    <span class="speed-label">Speed</span>
    <select class="speed-select" id="speedSelect">
      <option value="0.7">0.7×</option>
      <option value="1" selected>1.0×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="sentence-list" id="sentenceList"></div>

  <p class="note">⚠ Drag the audio file <strong style="color:var(--accent)">Generated_Audio_June_05__2026_-_9_08PM.wav</strong> onto this page to enable playback.</p>
</div>

<audio id="audioEl" src="question.mp3"></audio>

<script>
const SENTENCES = [
  { id: 1,  start: 0.0,   end: 4.0,   text: "인터넷 쇼핑을 자주 이용하는 이유는 무엇입니까?",                                                    vi: "Lý do bạn thường xuyên sử dụng mua sắm trực tuyến là gì?" },
  { id: 2,  start: 4.0,   end: 9.0,   text: "인터넷 쇼핑과 일반 쇼핑 중에서 어떤 것을 더 좋아합니까?",                                          vi: "Giữa mua sắm trực tuyến và mua sắm thông thường, bạn thích cái nào hơn?" },
  { id: 3,  start: 9.0,   end: 15.0,  text: "왜 직접 가서 쇼핑하는 것보다 인터넷 쇼핑이 더 편리하다고 생각합니까?",                                                                        vi: "Tại sao so với việc đi mua sắm trực tiếp thì bạn cho rằng mua sắm trực tuyến tiện lợi hơn?" },
  { id: 4,  start: 15.0,  end: 19.0,  text: "직접 가서 쇼핑하는 것도 좋아하는 부분이 있으니까?",                                                  vi: "Việc đi mua sắm trực tiếp cũng có điểm bạn thích chứ?" },
  { id: 5,  start: 19.0,  end: 24.0,  text: "쇼핑할 때 가장 중요하게 생각하는 것은 무엇입니까?",                                                  vi: "Điều bạn coi trọng nhất khi mua sắm là gì?" },
  { id: 6,  start: 24.0,  end: 27.9, text: "왜 가격을 가장 중요하게 생각합니까?",                                                                  vi: "Tại sao bạn coi giá cả là quan trọng nhất?" },
  { id: 7,  start: 28.04, end: 30.80, text: "품질은 중요하지 않습니까?",                                                                            vi: "Chất lượng không quan trọng sao?" },
  { id: 8,  start: 30.90, end: 33.70, text: "왜 쇼핑을 자주 사용합니까?",                                                                          vi: "Tại sao bạn thường xuyên dùng Shopee?" },
  { id: 9, start: 33.80, end: 37.00,  text: "다른 쇼핑 앱도 사용해 본 적이 있으니까?",                                                            vi: "Bạn đã từng dùng thử các ứng dụng mua sắm khác chưa?" },
  { id: 10, start: 37.2,  end: 41.00, text: "쇼핑에서 가장 자주 사는 물건은 무엇입니까?",                                                        vi: "Mặt hàng bạn mua thường xuyên nhất trên Shopee là gì?" },
  { id: 11, start: 41.20, end: 48.0,  text: "배송이 늦었던 경험에 대해 설명해 주세요. 2주 동안 기다렸을 때 기분이 어땠습니까?",                  vi: "Hãy kể về trải nghiệm giao hàng bị trễ. Bạn cảm thấy thế nào khi phải chờ 2 tuần?" },
  { id: 12, start: 48.0,  end: 52.0,  text: "상품이 설명과 달랐을 때 어떻게 있습니까?",                                                            vi: "Khi sản phẩm không đúng với mô tả, bạn đã làm gì?" },
  { id: 13, start: 52.2,  end: 56.0,  text: "반품하는 과정이 어렵지 않았습니까?",                                                                  vi: "Quy trình đổi trả hàng có khó khăn không?" },
  { id: 14, start: 56.0,  end: 59.0,  text: "반품하는 데 시간이 얼마나 걸렸습니까?",                                                              vi: "Việc đổi trả hàng mất bao lâu?" },
  { id: 15, start: 59.2,  end: 62.5,  text: "반품 말고 다른 방법도 있습니까?",                                                                      vi: "Ngoài đổi trả hàng, còn có cách nào khác không?" },
  { id: 16, start: 62.6,  end: 66.7, text: "반품과 환불 과정이 왜 불편합니까?",                                                                    vi: "Tại sao quy trình đổi trả và hoàn tiền lại bất tiện?" },
  { id: 17, start: 66.9, end: 69.9, text: "후기를 먼저 있는 이유는 무엇입니까?",                                                                  vi: "Lý do bạn đọc đánh giá trước là gì?" },
  { id: 18, start: 70.00, end: 73.20, text: "후기가 항상 정확하다고 생각합니까?",                                                                    vi: "Bạn có cho rằng đánh giá luôn luôn chính xác không?" },
  { id: 19, start: 73.40, end: 76.6, text: "후기를 안 보면 어떤 문제가 생깁니까?",                                                                vi: "Nếu không xem đánh giá thì sẽ gặp vấn đề gì?" },
  { id: 20, start: 76.9, end: 80.8, text: "인터넷 쇼핑의 단점은 개선될 수 있다고 생각합니까?",                                                  vi: "Bạn có cho rằng những nhược điểm của mua sắm trực tuyến có thể cải thiện được không?" },
  { id: 21, start: 81.00, end: 83.7,  text: "왜 개선이 어렵다고 생각합니까?",                                                                      vi: "Tại sao bạn cho rằng việc cải thiện là khó?" },
  { id: 22, start: 84.00,  end: 86.7, text: "어떤 부분이 가장 개선되면 좋겠습니까?",                                                              vi: "Bạn muốn phần nào được cải thiện nhất?" },
  { id: 23, start: 86.80, end: 90.6,  text: "앞으로도 인터넷 쇼핑을 계속 사용할 것입니까?",                                                      vi: "Bạn có tiếp tục sử dụng mua sắm trực tuyến trong tương lai không?" },
  { id: 24, start: 90.7,  end: 93.2,  text: "왜 계속 사용할 것입니까?",                                                                            vi: "Tại sao bạn sẽ tiếp tục sử dụng?" },
];

const audio = document.getElementById('audioEl');
const list = document.getElementById('sentenceList');
const progressFill = document.getElementById('progressFill');
const btnPlayAll = document.getElementById('btnPlayAll');
const speedSelect = document.getElementById('speedSelect');

let currentIdx = -1;
let playAllMode = false;
let audioLoaded = false;

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(2).padStart(5, '0');
  return `${String(m).padStart(2,'0')}:${sec}`;
}

// Render
SENTENCES.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'sentence-item';
  item.id = `s${i}`;
  item.innerHTML = `
    <span class="index">${String(s.id).padStart(2,'0')}</span>
    <div class="sentence-body">
      <div class="sentence-text">${s.text}</div>
      <div class="timestamp">${fmtTime(s.start)} → ${fmtTime(s.end)}</div>
      <button class="btn-translate" data-idx="${i}">
        🌐 Dịch
      </button>
      <div class="vi-text" id="vi${i}">${s.vi}</div>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="play-icon">
      <svg class="icon-play" width="11" height="11" viewBox="0 0 11 11" fill="var(--accent)">
        <polygon points="2,1 10,5.5 2,10"/>
      </svg>
      <svg class="icon-pause" width="11" height="11" viewBox="0 0 11 11" fill="#0e0e10">
        <rect x="2" y="1" width="3" height="9" rx="1"/>
        <rect x="7" y="1" width="3" height="9" rx="1"/>
      </svg>
    </div>
  `;
  item.addEventListener('click', (e) => {
    if (e.target.closest('.btn-translate')) return;
    playSentence(i, false);
  });
  list.appendChild(item);
});

// Translation toggle
list.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-translate');
  if (!btn) return;
  const idx = btn.dataset.idx;
  const viEl = document.getElementById(`vi${idx}`);
  const isVisible = viEl.classList.toggle('visible');
  btn.classList.toggle('active', isVisible);
  btn.innerHTML = isVisible
    ? `❌ Ẩn`
    : `🌐 Dịch`;
});

function setActive(idx) {
  document.querySelectorAll('.sentence-item').forEach((el, i) => {
    el.classList.toggle('playing', i === idx);
    if (i < idx) el.classList.add('played');
  });
  currentIdx = idx;
  const pct = SENTENCES.length > 1 ? (idx / (SENTENCES.length - 1)) * 100 : 0;
  progressFill.style.width = pct + '%';
  if (idx >= 0) {
    document.getElementById(`s${idx}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function clearActive() {
  document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('playing'));
  currentIdx = -1;
}

function playSentence(idx, fromPlayAll) {
  if (!audioLoaded) {
    showNoAudioMsg();
    return;
  }
  playAllMode = fromPlayAll;

  // Toggle if same sentence clicked
  if (!fromPlayAll && currentIdx === idx && !audio.paused) {
    audio.pause();
    clearActive();
    updatePlayAllBtn(false);
    return;
  }

  const s = SENTENCES[idx];
  audio.playbackRate = parseFloat(speedSelect.value);
  audio.currentTime = s.start;
  setActive(idx);
  audio.play().catch(() => showNoAudioMsg());
}

audio.addEventListener('timeupdate', () => {
  if (currentIdx < 0) return;
  const s = SENTENCES[currentIdx];
  if (audio.currentTime >= s.end) {
    if (playAllMode && currentIdx < SENTENCES.length - 1) {
      playSentence(currentIdx + 1, true);
    } else {
      audio.pause();
      clearActive();
      if (playAllMode) {
        progressFill.style.width = '100%';
        updatePlayAllBtn(false);
        playAllMode = false;
      }
    }
  }
});

audio.addEventListener('pause', () => {
  if (!playAllMode) clearActive();
});

btnPlayAll.addEventListener('click', () => {
  if (!audioLoaded) { showNoAudioMsg(); return; }
  if (playAllMode && !audio.paused) {
    audio.pause();
    playAllMode = false;
    updatePlayAllBtn(false);
    clearActive();
  } else {
    playSentence(0, true);
    updatePlayAllBtn(true);
  }
});

function updatePlayAllBtn(playing) {
  btnPlayAll.innerHTML = playing
    ? `<svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><rect x="2" y="1" width="3" height="9" rx="1"/><rect x="7" y="1" width="3" height="9" rx="1"/></svg> Pause All`
    : `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="2,1 11,6 2,11"/></svg> Play All`;
}

speedSelect.addEventListener('change', () => {
  audio.playbackRate = parseFloat(speedSelect.value);
});

// Drop audio file
let noAudioShown = false;
function showNoAudioMsg() {
  if (noAudioShown) return;
  noAudioShown = true;
  const note = document.querySelector('.note');
  note.style.color = '#c87070';
  note.textContent = '⚠ Please drag & drop the WAV file onto this page first.';
}

audioLoaded = true;
document.querySelector('.note').textContent = `✓ Loaded: ${file.name}`;
document.querySelector('.note').style.color = 'var(--accent)';
noAudioShown = false;

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.type.includes('audio') || file.name.endsWith('.wav'))) {
    const url = URL.createObjectURL(file);
    audio.src = url;
    audioLoaded = true;
    document.querySelector('.note').textContent = `✓ Loaded: ${file.name}`;
    document.querySelector('.note').style.color = 'var(--accent)';
    noAudioShown = false;
  }
});
</script>
</body>
</html>
