<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAI — Model Evaluation & Deployment Platform</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200..900;1,9..40,200..900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="vue.global.prod.js"></script>
  <script src="index.prod.js"></script>
  <style>
    :root {
      --sidebar-w: 240px;
      --sidebar-collapsed: 64px;
      --header-h: 56px;
      --font-display: 'Space Grotesk', sans-serif;
      --font-ui: 'DM Sans', sans-serif
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body,
    #app {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: var(--font-ui)
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      height: var(--header-h);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      transition: all .3s
    }

    .sidebar-logo .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0D9488, #06B6D4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .sidebar-logo .logo-mark svg {
      width: 18px;
      height: 18px;
      color: #fff
    }

    .sidebar-logo .logo-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 17px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity .2s
    }

    .sidebar-collapsed .logo-text {
      opacity: 0;
      width: 0
    }

    .main-layout {
      height: calc(100vh - var(--header-h))
    }

    .workspace-tabs .n-tabs-tab {
      padding: 8px 16px !important;
      font-size: 13px !important
    }

    .workspace-tabs .n-tabs-tab--active {
      background: rgba(13, 148, 136, .08) !important
    }

    .stat-card {
      transition: transform .2s, box-shadow .2s
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .12)
    }

    .chart-bar {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 100%;
      padding: 0 4px
    }

    .chart-bar .bar {
      flex: 1;
      border-radius: 3px 3px 0 0;
      transition: height .6s cubic-bezier(.4, 0, .2, 1);
      min-width: 0
    }

    .mini-chart {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 32px
    }

    .mini-chart .bar {
      width: 4px;
      border-radius: 2px;
      transition: height .4s
    }

    .donut-chart {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .donut-chart .inner {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      z-index: 1
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0
    }

    .pulse {
      animation: pulse 2s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    .fade-in {
      animation: fadeIn .3s ease
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .quick-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 16px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: all .2s;
      border: 1px solid transparent
    }

    .quick-action-btn:hover {
      background: rgba(13, 148, 136, .06);
      border-color: rgba(13, 148, 136, .2)
    }

    .quick-action-btn .icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .deploy-timeline .n-timeline-item {
      padding-bottom: 0 !important
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      flex-wrap: wrap
    }

    .n-data-table .n-data-table-td {
      font-size: 13px
    }

    .header-env-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: .3px
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, .15);
      border-radius: 3px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, .25)
    }

    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .15)
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, .25)
    }

    .perm-tree .n-tree-node-content {
      font-size: 13px
    }

    .wizard-step-content {
      min-height: 280px;
      padding: 24px 0
    }
  </style>
</head>

    const Icon = defineComponent({ props: { name: { type: String, required: true } }, setup(props) { return () => IC[props.name] || null; } });

    const DS_TYPES = ['Image Classification', 'Object Detection', 'Semantic Segmentation', 'Text Classification', 'Named Entity Recognition', 'Sentiment Analysis', 'Machine Translation', 'Speech Recognition', 'Anomaly Detection', 'Recommendation', 'Regression', 'Time Series', 'Graph Classification', 'Question Answering', 'Summarization', 'Text Generation', 'Image Generation', 'Tabular Classification'];
    const DS_FORMATS = ['COCO JSON', 'Pascal VOC', 'CSV', 'Parquet', 'TFRecord', 'LMDB', 'HDF5', 'JSONL', 'WebDataset', 'Arrow', 'TFRecord Compressed', 'Petastorm'];

    function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a }
    function pick(arr) { return arr[rand(0, arr.length - 1)] }
    function uuid() { return 'xxxx-xxxx-xxxx'.replace(/x/g, () => ('0123456789abcdef')[rand(0, 15)]) }
    function dateBefore(days) { const d = new Date(); d.setDate(d.getDate() - rand(0, days)); return d }
    function fmtDate(d) { return d.toISOString().slice(0, 10) }
    function fmtDateTime(d) { return d.toISOString().slice(0, 19).replace('T', ' ') }

    function genDatasets(n = 120) {
      const prefixes = ['ImageNet', 'COCO', 'CIFAR', 'WikiText', 'SQuAD', 'LibriSpeech', 'UCF101', 'Cityscapes', 'NYU Depth', 'Kitti', 'OpenImages', 'LAION', 'CommonCrawl', 'PubMed', 'ArXiv', 'Custom', 'Internal', 'Synthetic', 'Augmented', 'Curated'];
      const suffixes = ['v2.1', 'v3.0', '2024', '2023-Q4', '2024-Q1', 'Final', 'Raw', 'Cleaned', 'Balanced', 'Subset-A', 'Subset-B', 'Full', 'Mini', 'Large', 'XL'];
      return Array.from({ length: n }, (_, i) => ({
        id: `ds-${String(i + 1).padStart(4, '0')}`,
        name: `${pick(prefixes)} ${pick(suffixes)}`,
        type: pick(DS_TYPES),
        format: pick(DS_FORMATS),
        size: rand(1, 5000),
        samples: rand(100, 2000000),
        owner: pick(USERS).name,
        team: pick(TEAMS),
        created: dateBefore(365),
        updated: dateBefore(30),
        status: pick(['Active', 'Archived', 'Processing', 'Error']),
        version: `${rand(1, 5)}.${rand(0, 9)}.${rand(0, 9)}`,
        description: `${pick(DS_TYPES)} dataset for ${pick(['training', 'validation', 'testing', 'benchmarking'])} purposes.`,
        tags: Array.from({ length: rand(1, 4) }, () => pick(['image', 'text', 'audio', 'video', 'tabular', 'multimodal', 'balanced', 'imbalanced', 'labeled', 'unlabeled', 'synthetic', 'real-world'])),
        quality: pick(['High', 'Medium', 'Low', 'Unknown']),
        storage: pick(['S3', 'GCS', 'Azure Blob', 'Local NFS', 'MinIO']),
        downloadCount: rand(0, 5000),
      }))
    }

    function genModels(n = 55) {
      const names = ['ResNet', 'EfficientNet', 'ViT', 'BERT', 'GPT', 'LLaMA', 'Whisper', 'YOLO', 'U-Net', 'DINO', 'CLIP', 'Stable Diffusion', 'T5', 'BART', 'Wav2Vec', 'DETR', 'Swin', 'MaMo', 'Mamba', 'Phi', 'Gemma', 'Mistral', 'Mixtral', 'DeepSeek', 'Qwen'];
      const sizes = ['Tiny', 'Small', 'Base', 'Large', 'XL', 'XXL', '3B', '7B', '13B', '34B', '70B'];
      return Array.from({ length: n }, (_, i) => {
        const fw = pick(MOD_FRAMEWORKS); const nm = pick(names); const sz = pick(sizes);
        return {
          id: `mdl-${String(i + 1).padStart(4, '0')}`,
          name: `${nm}-${sz}`,
          framework: fw,
          status: pick(MOD_STATUSES),
          version: `v${rand(1, 8)}.${rand(0, 9)}`,
          params: rand(1, 175000),
          accuracy: Math.round((70 + Math.random() * 29.9) * 100) / 100,
          owner: pick(USERS).name,
          team: pick(TEAMS),
          created: dateBefore(400),
          updated: dateBefore(20),
          type: pick(['Classification', 'Detection', 'Segmentation', 'Generation', 'Embedding', 'Translation', 'Summarization', 'Recognition']),
          task: pick(DS_TYPES),
          license: pick(['MIT', 'Apache-2.0', 'CC-BY-4.0', 'GPL-3.0', 'Proprietary', 'Internal Only']),
          description: `${nm} variant (${sz}) for ${pick(DS_TYPES).toLowerCase()} tasks.`,
          trainings: rand(1, 50),
          evaluations: rand(0, 100),
          deployments: rand(0, 20),
          downloads: rand(0, 10000),
          tags: Array.from({ length: rand(1, 3) }, () => pick(['SOTA', 'efficient', 'real-time', 'edge-compatible', 'multimodal', 'fine-tuned', 'pretrained', 'quantized', 'distilled'])),
        }
      })

    /* ── Data Labeling View (Split Pane) ── */
    const LabelingView = defineComponent({
      setup() {
        const msg = inject('message');

        const items = ref(
          Array.from({ length: 20 }, (_, i) => ({
            id: i + 1,
            name: `sample_${String(i + 1).padStart(4, '0')}.jpg`,
            status: pick([
              'Labeled',
              'Unlabeled',
              'In Progress',
              'Reviewed'
            ]),
            labels: Array.from(
              { length: rand(0, 5) },
              () =>
                pick([
                  'car',
                  'person',
                  'tree',
                  'building',
                  'sky',
                  'road',
                  'sign',
                  'light'
                ])
            ),
            confidence: rand(40, 99)
          }))
        );

        const selectedIdx = ref(0);
        const labelInput = ref('');

        const selected = computed(
          () => items.value[selectedIdx.value] ?? null
        );

        function addLabel() {
          const label = labelInput.value.trim();

          if (!label || !selected.value) {
            return;
          }

          selected.value.labels.push(label);
          labelInput.value = '';
          msg?.success?.('Label added');
        }

        function removeLabel(label) {
          if (!selected.value) {
            return;
          }

          selected.value.labels =
            selected.value.labels.filter(
              x => x !== label
            );
        }

        function updateLabels(v) {
          if (selected.value) {
            selected.value.labels = v;
          }
        }

        function stColor(status) {
          return (
            {
              Labeled: 'success',
              'In Progress': 'warning',
              Unlabeled: 'default',
              Reviewed: 'info'
            }[status] || 'default'
          );
        }

        function confidenceStatus(v) {
          if (v >= 80) {
            return 'success';
          }

          if (v >= 60) {
            return 'warning';
          }

          return 'error';
        }

        return {
          items,
          selectedIdx,
          selected,
          labelInput,
          addLabel,
          removeLabel,
          updateLabels,
          stColor,
          confidenceStatus
        };

          if (!openTabs.find(t => t.key === key)) { openTabs.push({ key, label: flattenMenu(menuOptions).find(m => m.key === key)?.label || key, closable: true }); }
          activeTab.value = key;
        }
        function flattenMenu(items) { let r = []; for (const item of items) { r.push(item); if (item.children) r = r.concat(flattenMenu(item.children)); } return r; }
        function closeTab(key) { const idx = openTabs.findIndex(t => t.key === key); if (idx > -1) { openTabs.splice(idx, 1); if (activeTab.value === key) { activeTab.value = openTabs[Math.max(0, idx - 1)]?.key || 'dashboard'; activeMenu.value = activeTab.value; } } }
        function handleProfileClick(key) { if (key === 'logout') { dialog.warning({ title: 'Logout', content: 'Are you sure you want to logout?', positiveText: 'Logout', negativeText: 'Cancel', onPositiveClick: () => message.success('Logged out (mock)') }); } else { message.info(key + ' clicked (mock)'); showProfile.value = false; } }

        function notifyDemo() { notification.info({ title: 'Platform Notification', content: 'New model evaluation results are available for review.', duration: 4000 }); }

        const searchPrefix = () => IC.search;
        const collapsedIcon = () => null;
        onMounted(() => { setTimeout(notifyDemo, 2000); });

        return { darkMode, collapsed, activeMenu, openTabs, activeTab, showDrawer, searchVal, envVal, notifCount, showNotif, showProfile, showEnvSelect, envOpts, notifOpts, profileOpts, currentOverrides, breadcrumb, handleMenuUpdate, closeTab, handleProfileClick, menuOptions, IC, message, darkTheme, themeOverrides: currentOverrides, searchPrefix, collapsedIcon };
      },
      template: `
    <n-config-provider :theme="darkMode?darkTheme:null" :theme-overrides="themeOverrides">
      <n-layout has-sider style="height:100vh">
      <n-layout-sider bordered :collapsed="collapsed" :collapsed-width="64" :width="240" :show-trigger="false" :native-scrollbar="false" class="sidebar-collapsed" :style="{transition:'width .3s cubic-bezier(.4,0,.2,1)'}">
        <div class="sidebar-logo">
          <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 10 10-12h-9l1-10z"/></svg></div>
          <span class="logo-text">NexusAI</span>
        </div>
        <n-menu :options="menuOptions" :value="activeMenu" :collapsed="collapsed" :collapsed-width="64" :collapsed-icon="collapsedIcon" :root-indent="16" :indent="12" @update:value="handleMenuUpdate" :inverted="true" style="--n-item-text-color-active:#14B8A6"/>
      </n-layout-sider>
      <n-layout>
        <n-layout-header bordered style="height:var(--header-h);padding:0 20px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(12px)">
          <n-space align="center" :size="12">
            <n-button quaternary :style="{fontSize:'18px'}" @click="collapsed=!collapsed"><n-icon :size="20"><icon name="menu"/></n-icon></n-button>
            <n-breadcrumb style="font-size:13px">
              <n-breadcrumb-item v-for="(b,i) in breadcrumb" :key="i">{{b}}</n-breadcrumb-item>
            </n-breadcrumb>
          </n-space>
          <n-space align="center" :size="8">
            <n-auto-complete v-model:value="searchVal" :options="[]" placeholder="Search anything..." clearable size="small" style="width:220px" :input-props="{prefix:searchPrefix}"/>
            <n-popover trigger="click" placement="bottom-end" :show="showEnvSelect" @update:show="v=>showEnvSelect=v">
              <template #trigger>
                <n-button size="small" quaternary @click="showEnvSelect=!showEnvSelect">
                  <span class="header-env-tag" :style="{background:envVal==='Production'?'rgba(13,148,136,0.15)':envVal==='Staging'?'rgba(245,158,11,0.15)':envVal==='Development'?'rgba(139,92,246,0.15)':'rgba(6,182,212,0.15)',color:envVal==='Production'?'#0D9488':envVal==='Staging'?'#f59e0b':envVal==='Development'?'#8b5cf6':'#06b6d4'}">{{envVal}}</span>
                </n-button>
              </template>
              <n-radio-group v-model:value="envVal" size="small">
                <n-space vertical><n-radio v-for="e in envOpts" :key="e.value" :value="e.value">{{e.label}}</n-radio></n-space>
              </n-radio-group>
            </n-popover>
            <n-badge :value="notifCount" :max="9">
              <n-button quaternary size="small" @click="showNotif=!showNotif"><n-icon :size="18"><icon name="bell"/></n-icon></n-button>
            </n-badge>
            <n-dropdown :options="profileOpts" @select="handleProfileClick" trigger="click" :show-arrow="true" placement="bottom-end">
              <n-button quaternary size="small" style="padding:0 4px">
                <n-space align="center" :size="8"><n-avatar :size="28" round style="background:rgba(13,148,136,0.15);color:#0D9488;font-weight:600;font-size:12px">SC</n-avatar><n-text style="font-size:13px;font-weight:500">Sarah Chen</n-text></n-space>
              </n-button>
            </n-dropdown>
            <n-button quaternary size="small" @click="darkMode=!darkMode"><n-icon :size="18"><icon :name="darkMode?'sun':'moon'"/></n-icon></n-button>
          </n-space>
        </n-layout-header>
        <n-layout-content :native-scrollbar="false" style="padding:12px 16px">
          <n-tabs v-model:value="activeTab" type="line" animated class="workspace-tabs" style="margin-bottom:12px">
            <n-tab-pane v-for="tab in openTabs" :key="tab.key" :name="tab.key" :tab="tab.label">
              <template #tab>
                <n-space align="center" :size="4">
                  <span>{{tab.label}}</span>
                  <n-icon v-if="tab.closable" :size="14" style="cursor:pointer" @click.stop="closeTab(tab.key)"><icon name="close"/></n-icon>
                </n-space>
              </template>
            </n-tab-pane>
          </n-tabs>
          <dashboard-view v-if="activeTab==='dashboard'"/>
          <dataset-view v-else-if="activeTab==='datasets'"/>
          <model-view v-else-if="activeTab==='models'"/>
          <training-view v-else-if="activeTab==='training'"/>
          <eval-view v-else-if="activeTab==='evaluation'"/>
          <deploy-view v-else-if="activeTab==='deploys'"/>
          <labeling-view v-else-if="activeTab==='labeling'"/>
          <report-view v-else-if="activeTab==='reports'"/>
          <user-view v-else-if="activeTab==='users'"/>
          <role-view v-else-if="activeTab==='roles'"/>
          <perm-view v-else-if="activeTab==='permissions'"/>
          <log-view v-else-if="activeTab==='logs'"/>
        </n-layout-content>
      </n-layout>
    </n-layout>
    </n-config-provider>
  `
    });

    /* ── Bootstrap ── */
    const app = createApp(MainApp);
    app.use(naive);
    app.component('icon', Icon);
    app.component('bar-chart', BarChart);
    app.component('sparkline', Sparkline);
    app.component('donut-chart', DonutChart);
    app.component('dashboard-view', DashboardView);
    app.component('dataset-view', DatasetView);
    app.component('model-view', ModelView);
    app.component('training-view', TrainingView);
    app.component('eval-view', EvalView);
    app.component('deploy-view', DeployView);
    app.component('labeling-view', LabelingView);
    app.component('report-view', ReportView);
    app.component('user-view', UserView);
    app.component('role-view', RoleView);
    app.component('perm-view', PermView);
    app.component('log-view', LogView);
    app.mount('#app');
  </script>
</body>
